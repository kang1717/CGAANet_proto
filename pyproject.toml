[project]
name = "cgaanet"
version = "0.1"
authors = [
    { name = "Sungwoo Kang", email = "sung.w.kang@kist.re.kr" },
]
description = "Coarse-grained all-atom force field"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: POSIX :: Linux",
]
dependencies = [
    "ase",
    "braceexpand",
    "pyyaml",
    "e3nn",
    "tqdm",
    "scikit-learn",
    "torch_geometric>=2.5.0",
    "numpy<2.0",
    "matscipy",
]
[project.optional-dependencies]
test = ["matscipy", "pytest-cov>=5"]


[project.scripts]
cgaanet = "cgaanet.main.cgaanet:main"
cgaanet_get_model = "cgaanet.main.cgaanet_get_model:main"
cgaanet_graph_build = "cgaanet.main.cgaanet_graph_build:main"
cgaanet_inference = "cgaanet.main.cgaanet_inference:main"
cgaanet_patch_lammps = "cgaanet.main.cgaanet_patch_lammps:main"
cgaanet_preset = "cgaanet.main.cgaanet_preset:main"

[project.urls]
Homepage = "https://github.com/MDIL-SNU/SevenNet"
Issues = "https://github.com/MDIL-SNU/SevenNet/issues"

[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=61.0"]

[tool.setuptools.package-data]
cgaanet = [
    "logo_ascii",
    "pair_e3gnn/*.cpp",
    "pair_e3gnn/*.h",
    "pair_e3gnn/*.cu",
    "pair_e3gnn/patch_lammps.sh",
    "presets/*.yaml",
    "py.typed",
]

[tool.setuptools.packages.find]
include = ["cgaanet*"]
exclude = ["tests*", "example_inputs*", ]

[tool.pytest.ini_options]
log_cli = true
log_cli_format = "%(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)"
log_cli_date_format = "%Y-%m-%d %H:%M:%S"

[tool.ruff]
line-length = 85

[tool.ruff.lint]
extend-select = ["E501"]

[tool.ruff.format]
quote-style = "single"
docstring-code-format = true
